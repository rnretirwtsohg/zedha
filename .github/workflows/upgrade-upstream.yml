name: Upgrade Upstream Zed

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

concurrency:
  group: upgrade-upstream-zed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upgrade:
    name: Propose latest stable upgrade
    if: github.repository == 'rnretirwtsohg/zedha'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.UPGRADE_PR_TOKEN }}
          persist-credentials: false

      - name: Detect latest stable Zed
        id: candidate
        run: |
          old_tag=$(python3 -c 'import json; print(json.load(open("upstream/stable.json"))["tag"])')
          old_commit=$(python3 -c 'import json; print(json.load(open("upstream/stable.json"))["commit"])')

          ./scripts/update-upstream-pin

          if git diff --quiet -- upstream/stable.json; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_tag=$(python3 -c 'import json; print(json.load(open("upstream/stable.json"))["tag"])')
          new_commit=$(python3 -c 'import json; print(json.load(open("upstream/stable.json"))["commit"])')
          {
            echo "upgrade=true"
            echo "old_tag=$old_tag"
            echo "old_commit=$old_commit"
            echo "new_tag=$new_tag"
            echo "new_commit=$new_commit"
            echo "branch=automation/upgrade-zed-latest"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch candidate Zed
        if: steps.candidate.outputs.upgrade == 'true'
        run: ./scripts/fetch-upstream

      - name: Install Nix
        if: steps.candidate.outputs.upgrade == 'true'
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Synchronize Nix pin
        if: steps.candidate.outputs.upgrade == 'true'
        run: |
          ./scripts/sync-nix-pin
          ./scripts/check-nix-pin

      - name: Apply Zedha patches
        if: steps.candidate.outputs.upgrade == 'true'
        run: ./scripts/apply-patches

      - name: Check Zedha identity
        if: steps.candidate.outputs.upgrade == 'true'
        run: ./scripts/check-identity

      - name: Push rolling upgrade branch
        if: steps.candidate.outputs.upgrade == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_PR_TOKEN }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          NEW_TAG: ${{ steps.candidate.outputs.new_tag }}
        run: |
          git config user.name "Zedha Upgrade Bot"
          git config user.email "zedha-upgrade-bot@users.noreply.github.com"
          git fetch --no-tags origin "$BRANCH" || true
          git switch -C "$BRANCH"
          git add upstream/stable.json flake.lock
          git commit -m "Upgrade Zedha to Zed $NEW_TAG"
          gh auth setup-git
          git push --set-upstream --force-with-lease origin "$BRANCH"

      - name: Open or refresh upgrade pull request
        if: steps.candidate.outputs.upgrade == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_PR_TOKEN }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          OLD_TAG: ${{ steps.candidate.outputs.old_tag }}
          OLD_COMMIT: ${{ steps.candidate.outputs.old_commit }}
          NEW_TAG: ${{ steps.candidate.outputs.new_tag }}
          NEW_COMMIT: ${{ steps.candidate.outputs.new_commit }}
        run: |
          cat > "$RUNNER_TEMP/upgrade-pr-body.md" <<EOF
          Upgrade the pinned upstream Zed stable release from $OLD_TAG to
          $NEW_TAG.

          Previous commit: $OLD_COMMIT
          New commit: $NEW_COMMIT

          The downstream patches apply cleanly and the identity preflight
          passes. GitHub will merge this pull request automatically after the
          launcher tests, Linux package, and macOS DMG gates pass.
          EOF

          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Upgrade Zedha to Zed $NEW_TAG" \
              --body-file "$RUNNER_TEMP/upgrade-pr-body.md")
            pr_number=${pr_url##*/}
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Upgrade Zedha to Zed $NEW_TAG" \
              --body-file "$RUNNER_TEMP/upgrade-pr-body.md"
          fi
      - name: Report blocked upgrade
        if: failure() && steps.candidate.outputs.upgrade == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_PR_TOKEN }}
          NEW_TAG: ${{ steps.candidate.outputs.new_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automated Zed upgrade is blocked"
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          body="The automated upgrade to ${NEW_TAG:-the latest stable Zed} failed before merge.\n\nRun: $RUN_URL"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
