name: Build Linux Package

on:
  pull_request:
    paths: [flake.nix, flake.lock, 'nix/**', 'patches/**', upstream/stable.json, scripts/check-nix-pin, .github/workflows/build-linux.yml]
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, 'nix/**', 'patches/**', upstream/stable.json, scripts/check-nix-pin, .github/workflows/build-linux.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: cachix/cachix-action@v16
        with:
          name: zedha
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - run: ./scripts/check-nix-pin
      - run: nix build .#zedha --fallback --print-build-logs --accept-flake-config
      - run: nix flake check --no-build --accept-flake-config
      - run: nix build .#checks.x86_64-linux.package-identity --fallback --print-build-logs --accept-flake-config
