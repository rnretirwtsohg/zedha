name: Report Upgrade Status

on:
  workflow_run:
    workflows:
      - Test
      - Build Linux Package
      - Build macOS Artifact
    types: [completed]
  push:
    branches: [main]
    paths: [upstream/stable.json, flake.lock]

permissions:
  contents: read
  issues: write

concurrency:
  group: upgrade-status-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

# Two rolling upgrade branches share these gates: Zed stable upgrades on
# automation/upgrade-zed-latest and Nixpkgs advances on
# automation/advance-nixpkgs. Each has its own blocker issue so a blocked Zed
# upgrade never holds back Nixpkgs.
jobs:
  merge-upgrade:
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["automation/upgrade-zed-latest", "automation/advance-nixpkgs"]'), github.event.workflow_run.head_branch) &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge after every gate passes
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_PR_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$HEAD_BRANCH" \
            --json number,headRefOid \
            --jq '.[0] // empty')
          if [[ -z "$pr" || "$(jq -r .headRefOid <<< "$pr")" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          pr_number=$(jq -r .number <<< "$pr")
          view=$(gh pr view "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --json files,statusCheckRollup)
          checks=$(jq '.statusCheckRollup' <<< "$view")
          gates='Test|Script tests
          Test|Apply patches
          Test|Targeted Zedha tests
          Build Linux Package|Build Zedha package'
          # The DMG builds only when the Zed pin moves; a Nixpkgs advance
          # never triggers it.
          if jq -e '.files | any(.path == "upstream/stable.json")' <<< "$view" > /dev/null; then
            gates+=$'\nBuild macOS Artifact|Build Zedha DMG'
          fi
          while IFS='|' read -r workflow check; do
            passed=$(jq \
              --arg workflow "$workflow" \
              --arg check "$check" \
              '[.[] | select(
                .workflowName == $workflow and
                .name == $check and
                .status == "COMPLETED" and
                .conclusion == "SUCCESS"
              )] | length' <<< "$checks")
            if [[ "$passed" -ne 1 ]]; then
              echo "Waiting for $workflow / $check"
              exit 0
            fi
          done <<< "$gates"

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch

  report-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["automation/upgrade-zed-latest", "automation/advance-nixpkgs"]'), github.event.workflow_run.head_branch) &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update blocker issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECK_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [[ "$HEAD_BRANCH" == automation/advance-nixpkgs ]]; then
            title="Automated Nixpkgs advance is blocked"
          else
            title="Automated Zed upgrade is blocked"
          fi
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          body="$CHECK_NAME finished with $CONCLUSION on the rolling upgrade PR.\n\nRun: $RUN_URL"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  resolve-blocker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Close resolved blocker issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titles=()
          if ! git diff --quiet HEAD^ HEAD -- upstream/stable.json; then
            titles+=("Automated Zed upgrade is blocked")
          fi
          nixpkgs_rev() {
            git show "$1:flake.lock" | jq -r '.nodes[.root].inputs.nixpkgs as $node
              | if ($node | type) == "string" then .nodes[$node].locked.rev else "follows" end'
          }
          if [[ "$(nixpkgs_rev HEAD^)" != "$(nixpkgs_rev HEAD)" ]]; then
            titles+=("Automated Nixpkgs advance is blocked")
          fi
          for title in "${titles[@]}"; do
            issue_number=$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [[ -n "$issue_number" ]]; then
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "Resolved by the upgrade merged in $GITHUB_SHA."
            fi
          done
